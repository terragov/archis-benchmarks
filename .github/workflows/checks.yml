name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The internal-terms list is a secret, so it is not available to pull requests
      # from forks. Those run every other check; export PRs come from this repository
      # and must pass all of them.
      - name: Private paths, personal data, internal terms
        env:
          INTERNAL_TERMS: ${{ secrets.INTERNAL_TERMS }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$FROM_FORK" = "true" ]; then
            python3 scripts/check_public.py
          else
            python3 scripts/check_public.py --require-internal-terms
          fi

      # Runs the CLI image directly: gitleaks-action needs a paid licence for
      # organisation repositories.
      - name: Secrets in the tree and the history
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1
